name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.nome }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        nome:
          - bubblesort-tdd
          - carrinho-compras-tdd
          - conta-bancaria-tdd-maven
          - estoque-tdd
          - exercicios_integracao_springboot
          - analise-teste-usuario
          - central-pedidos
        include:
          - nome: bubblesort-tdd
            caminho: 2-bimestre/semana10-tdd/bubblesort-tdd
          - nome: carrinho-compras-tdd
            caminho: 2-bimestre/semana10-tdd/carrinho-compras-tdd
          - nome: conta-bancaria-tdd-maven
            caminho: 2-bimestre/semana10-tdd/conta-bancaria-tdd-maven
          - nome: estoque-tdd
            caminho: 2-bimestre/semana10-tdd/estoque-tdd
          - nome: exercicios_integracao_springboot
            caminho: 2-bimestre/semana11-integracao-springboot/exercicios_integracao_springboot
          - nome: analise-teste-usuario
            caminho: 2-bimestre/semana14-teste-usuario-final/analise
          - nome: central-pedidos
            caminho: 1-bimestre/atividade03-junit-central-pedidos
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.caminho }}
    steps:
      - uses: actions/checkout@v5

      - name: Java 17 (Temurin) com cache do Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Prepara o Maven Wrapper (até 3 tentativas, contra falha transitória de rede)
        run: for i in 1 2 3; do ./mvnw -B -v && exit 0; echo "tentativa $i falhou"; sleep 15; done; exit 1

      - name: ./mvnw verify (Maven Wrapper 3.9.9; testes + checagem de cobertura)
        run: ./mvnw -B -ntp verify

      - name: Publica relatórios JaCoCo e Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ matrix.nome }}-${{ matrix.os }}
          path: |
            ${{ matrix.caminho }}/target/site/jacoco/
            ${{ matrix.caminho }}/target/surefire-reports/
          if-no-files-found: warn

  mutacao:
    name: mutação PIT (${{ matrix.nome }})
    runs-on: ubuntu-latest
    continue-on-error: true   # não bloqueante
    strategy:
      fail-fast: false
      matrix:
        nome: [bubblesort-tdd, carrinho-compras-tdd, conta-bancaria-tdd-maven, estoque-tdd]
    defaults:
      run:
        working-directory: 2-bimestre/semana10-tdd/${{ matrix.nome }}
    steps:
      - uses: actions/checkout@v5

      - name: Java 17 (Temurin) com cache do Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Prepara o Maven Wrapper (até 3 tentativas)
        run: for i in 1 2 3; do ./mvnw -B -v && exit 0; echo "tentativa $i falhou"; sleep 15; done; exit 1

      - name: ./mvnw -Pmutacao verify
        run: ./mvnw -B -ntp -Pmutacao verify

      - name: Publica relatório PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-${{ matrix.nome }}
          path: 2-bimestre/semana10-tdd/${{ matrix.nome }}/target/pit-reports/
          if-no-files-found: warn
